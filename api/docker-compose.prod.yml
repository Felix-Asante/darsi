# Production stack for the API. Copy production.env.example to .env, fill it in, then:
#   docker compose -f docker-compose.prod.yml up -d --build
# Object storage (Cloudflare R2) and email (Resend) are external services.

x-app: &app
  build: .
  image: darsi-api
  restart: unless-stopped
  environment: &app-env
    NODE_ENV: production
    LOG_LEVEL: ${LOG_LEVEL:-info}
    PORT: 8080
    DATABASE_URL: postgres://darsi_app:${DATABASE_APP_PASSWORD:?}@postgres:5432/darsi
    REDIS_URL: redis://redis:6379
    API_URL: ${API_URL:?}
    APP_URL: ${APP_URL:?}
    CORS_ORIGINS: ${CORS_ORIGINS:?}
    COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    AUTH_SECRET: ${AUTH_SECRET:?}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    MAIL_TRANSPORT: resend
    RESEND_API_KEY: ${RESEND_API_KEY:?}
    MAIL_FROM: ${MAIL_FROM:?}
    S3_ENDPOINT: ${S3_ENDPOINT:?}
    S3_REGION: ${S3_REGION:-auto}
    S3_BUCKET: ${S3_BUCKET:?}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
    MALWARE_SCANNER: clamav
    CLAMAV_HOST: clamav
    CLAMAV_PORT: 3310
    GOTENBERG_URL: http://gotenberg:3000
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

services:
  migrate:
    <<: *app
    restart: "no"
    command: ["node", "dist/database/run-migrations.js"]
    environment:
      <<: *app-env
      DATABASE_MIGRATOR_URL: postgres://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/darsi
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on: &app-deps
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
      gotenberg:
        condition: service_started

  worker:
    <<: *app
    command: ["node", "--enable-source-maps", "dist/worker.js"]
    depends_on: *app-deps

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: darsi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d darsi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ needs keys never to be evicted.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav-debian:stable
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      # The first start downloads the virus database, which takes a few minutes.
      start_period: 5m

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  clamav-data:
